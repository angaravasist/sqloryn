name: Repository safeguards

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-safeguards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-safeguards:
    name: repo-safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate repository baseline
        run: python3 scripts/repo_preflight.py
      - name: Validate whitespace
        run: git diff --check

name: Repository safeguards

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      accept_sql_server_license:
        description: Accept SQL Server Developer test-use terms and create temporary test credentials
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: repo-safeguards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe-components:
    name: probe-components (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked dependencies and audit vulnerabilities
        run: dotnet restore SQLoryn.slnx --locked-mode --configfile NuGet.Config
      - name: Build with warnings as errors
        run: dotnet build SQLoryn.slnx --no-restore --configuration Release
      - name: Component assertions (no SQL Server)
        run: |
          dotnet run --project tests/SqlClientProbe.Tests --no-build --configuration Release
          dotnet run --project tests/Sqloryn.Core.Tests --no-build --configuration Release
      - name: Disposable runner safety tests (no Docker)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish development macOS app (Mac runners only)
        if: runner.os == 'macOS'
        run: bash scripts/build_macos_app.sh

  sql-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.accept_sql_server_license
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore SQLoryn.slnx --locked-mode --configfile NuGet.Config
      - run: dotnet build SQLoryn.slnx --no-restore --configuration Release
      - name: Isolated SQL Server 2022 acceptance checks
        run: python3 scripts/run_sql_probe.py --accept-sql-server-license

  repo-safeguards:
    name: repo-safeguards
    needs: [probe-components, sql-integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require component success and any requested integration run
        env:
          COMPONENT_RESULT: ${{ needs.probe-components.result }}
          INTEGRATION_RESULT: ${{ needs.sql-integration.result }}
          INTEGRATION_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.accept_sql_server_license }}
        run: |
          test "$COMPONENT_RESULT" = success
          if test "$INTEGRATION_REQUESTED" = true; then
            test "$INTEGRATION_RESULT" = success
          else
            test "$INTEGRATION_RESULT" = skipped
          fi
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate repository baseline
        run: python3 scripts/repo_preflight.py
      - name: Validate whitespace
        run: git diff --check

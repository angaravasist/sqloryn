version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Stay on the 10.0.x line for net10.0; see docs/DEPENDENCIES.md.
      - dependency-name: System.Security.Cryptography.Pkcs
        update-types: ["version-update:semver-major"]

# Require lockfiles where supported; do not auto-merge dependency PRs.
